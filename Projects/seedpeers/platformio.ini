; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
framework = arduino

[env:esp32dev]
board = esp32dev
build_src_filter = +<seedpeers.cpp>
build_flags = -DAPP_NAME=\"SEEDPEERS\"

[env:RemoteXY]
extends = env:esp32dev
lib_deps = remotexy/RemoteXY@^4.1.11
build_src_filter = +<seedpeers_remoteXY.cpp>
build_flags = -DAPP_NAME=\"seedpeers_remoteXY\"

[env:RemoteXY_V3]
extends = env:esp32dev
platform = https://github.com/pioarduino/platform-espressif32.git
lib_deps = remotexy/RemoteXY@^4.1.11
build_src_filter = +<seedpeers_remoteXY_V3.cpp>
build_flags = -DAPP_NAME=\"seedpeers_remoteXY_V3\"
